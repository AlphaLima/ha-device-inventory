name: Release

# Push a tag like v1.0.0 -> a GitHub release with that name is created automatically,
# so HACS / the Home Assistant Marketplace show the version number instead of a commit id.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches manifest.json
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/device_inventory/manifest.json'))['version'])")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v$v"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --latest
